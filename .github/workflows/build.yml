name: Build JAR

# Compiles the MIDlet on GitHub's machines, packages GTA_VC_J2ME.jar/.jad and publishes them as a release.
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      rebuild_assets:
        description: "Re-run the sprite/font converter before compiling"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rebuild assets (optional, or when assets/fonts/hud.ttf exists)
        if: ${{ inputs.rebuild_assets || hashFiles('assets/fonts/hud.ttf', 'assets/fonts/hud.otf') != '' }}
        run: |
          pip install --quiet numpy pillow
          python3 tools/fx_export.py

      - name: Compile + preverify (CLDC 1.1 / MIDP 2.0)
        run: bash tools/build.sh

      - name: Package JAR/JAD
        run: |
          N=${{ github.run_number }}
          export MIDLET_VERSION="0.$((2 + N / 100)).$((N % 100))"
          echo "MIDLET_VERSION=$MIDLET_VERSION" >> $GITHUB_ENV
          python3 tools/package.py dist
          # smaller build: Ocean Beach + Washington Beach only (rest of the map is sea)
          MAP_REGION=16,2,25,20 JAR_NAME=GTA_VC_J2ME_lite python3 tools/package.py dist
          # legacy: Ocean Drive only, 16 px textures, small pools (Asha 311 class phones, touch buttons)
          pip install --quiet pillow
          LEGACY=1 python3 tools/package.py dist
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: GTA_VC_J2ME-${{ env.MIDLET_VERSION }}
          path: dist/*

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: GTA VC J2ME ${{ env.MIDLET_VERSION }} (build ${{ github.run_number }})
          body: |
            Automatic build of ${{ github.sha }}.
            Install on the Nokia E72: copy the .jar (and .jad) to the phone and open it.
            GTA_VC_J2ME.jar = whole map (big); GTA_VC_J2ME_lite.jar = Ocean Beach + Washington Beach only. GTA_VC_J2ME_legacy.jar = Ocean Drive only, for low-end phones (touch buttons on touch screens).
          files: |
            dist/GTA_VC_J2ME.jar
            dist/GTA_VC_J2ME.jad
            dist/GTA_VC_J2ME_lite.jar
            dist/GTA_VC_J2ME_lite.jad
            dist/GTA_VC_J2ME_legacy.jar
            dist/GTA_VC_J2ME_legacy.jad
          make_latest: true
